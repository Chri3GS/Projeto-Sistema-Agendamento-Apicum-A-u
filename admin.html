<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Acesso administrativo | TechAgenda</title>
    <link rel="stylesheet" href="/admin.css">
</head>
<body>
    <main class="admin-card">
        <div class="brand"><img src="/imagens/logo.png" alt="TechAgenda"></div>
        <h1>Acesso administrativo</h1>
        <p class="subtitle">Entre com suas credenciais para gerenciar o TechAgenda.</p>
        <form id="admin-login-form">
            <div class="field">
                <label for="admin-username">Usuário</label>
                <input id="admin-username" name="username" type="text" autocomplete="username"
                    maxlength="100" required>
            </div>
            <div class="field">
                <label for="admin-password">Senha</label>
                <input id="admin-password" name="password" type="password"
                    autocomplete="current-password" required>
            </div>
            <p id="admin-login-error" class="error" role="alert" hidden></p>
            <button id="admin-login-submit" class="submit" type="submit">Entrar</button>
        </form>
        <p class="subtitle"><a href="/">Voltar ao TechAgenda</a></p>
    </main>
    <script>
        const form = document.getElementById('admin-login-form');
        const button = document.getElementById('admin-login-submit');
        const errorMessage = document.getElementById('admin-login-error');

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            button.disabled = true;
            button.textContent = 'Validando...';
            errorMessage.hidden = true;

            try {
                const response = await fetch('/.netlify/functions/admin-login', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('admin-username').value,
                        password: document.getElementById('admin-password').value
                    })
                });
                const result = await response.json();
                document.getElementById('admin-password').value = '';
                if (!response.ok) throw new Error(result.error || 'Não foi possível entrar.');
                window.location.assign('/admin/painel');
            } catch (error) {
                document.getElementById('admin-password').value = '';
                errorMessage.textContent = error.message || 'Não foi possível entrar.';
                errorMessage.hidden = false;
                button.disabled = false;
                button.textContent = 'Entrar';
            }
        });
    </script>
</body>
</html>
